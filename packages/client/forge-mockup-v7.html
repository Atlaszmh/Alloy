<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Alloy — Forge Screen v7 (Real Gem Art)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-darkest: #060608;
  --bg-dark: #0a0a0f;
  --bg-mid: #111118;
  --bg-light: #1a1a26;
  --border-dark: #252536;
  --border-mid: #363650;
  --gold: #d4a834;
  --gold-light: #e0bc4a;
  --gold-pale: #ecd06a;
  --bronze: #b89868;
  --bronze-dark: #a08050;
  --bronze-light: #c8a878;
  --teal: #2dd4bf;
  --success: #34d399;
  --warning: #fbbf24;
  --danger: #f87171;
  --text: #e8e8f0;
  --text-dim: #6a6a88;
  --text-muted: #4a4a68;
  --fire: #e8553a;
  --cold: #3a9be8;
  --lightning: #d4c040;
  --poison: #2db369;
  --shadow: #8b3ae8;
  --chaos: #e83a8b;
  --physical: #c0c0c0;
  --tier1: #8a8a8a;
  --tier2: #3a9be8;
  --tier3: #9b59b6;
  --tier4: #e8553a;
  --shadow-button: 0 2px 8px rgba(0,0,0,0.4), 0 1px 3px rgba(212,168,52,0.2);
}

body {
  background: #000;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  overflow: auto;
}

/* --- Scenario Nav (outside phone) --- */
.scenario-nav {
  display: flex;
  gap: 6px;
  padding: 12px 8px 8px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 500px;
}
.scenario-nav button {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid #333;
  background: #181820;
  color: #888;
  cursor: pointer;
  transition: all 0.15s;
}
.scenario-nav button.active {
  background: var(--gold);
  color: #000;
  border-color: var(--gold);
}
.scenario-nav button:hover:not(.active) {
  background: #252536;
  color: #ccc;
}

.phone-frame {
  width: 393px;
  height: 852px;
  background: var(--bg-dark);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border-dark);
  border-radius: 24px;
  box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 120px rgba(10,10,15,0.5);
  margin-bottom: 20px;
}

/* --- Header --- */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-dark);
  border-bottom: 1px solid var(--border-dark);
  flex-shrink: 0;
}
.header-row1 {
  height: 28px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 6px;
}
.phase-title {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--gold);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
}
.round-pill {
  background: var(--border-dark);
  border: 1px solid var(--border-mid);
  color: var(--bronze);
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  white-space: nowrap;
}
.header-spacer { flex: 1; }
.timer-bar-wrap {
  width: 80px;
  height: 14px;
  background: var(--bg-mid);
  border-radius: 7px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border-dark);
}
.timer-bar-fill {
  height: 100%;
  border-radius: 7px;
  transition: width 0.3s;
}
.timer-bar-fill.normal { background: linear-gradient(90deg, #34d399, #2dd4bf); }
.timer-bar-fill.urgent { background: linear-gradient(90deg, #f87171, #e8553a); }
.timer-bar-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 10px;
  color: white;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}
.done-btn {
  background: var(--gold);
  color: var(--bg-dark);
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  border: none;
  border-radius: 6px;
  padding: 4px 14px;
  cursor: pointer;
  letter-spacing: 0.02em;
}

/* --- Flux Bar --- */
.flux-bar {
  flex-shrink: 0;
  height: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, rgba(251,191,36,0.06) 0%, rgba(251,191,36,0.02) 100%);
  border-bottom: 1px solid var(--border-dark);
  position: relative;
}
.flux-bolts {
  display: flex;
  gap: 4px;
  align-items: center;
  margin-bottom: 1px;
}
.flux-bolt {
  font-size: 14px;
  line-height: 1;
  transition: color 0.3s, filter 0.3s;
}
.flux-bolt.filled {
  color: #fbbf24;
  filter: drop-shadow(0 0 3px rgba(251,191,36,0.5));
}
.flux-bolt.spent {
  color: #252536;
  filter: none;
}
.flux-bolt.low-pulse {
  animation: boltPulse 1.2s ease-in-out infinite;
}
@keyframes boltPulse {
  0%, 100% { filter: drop-shadow(0 0 2px rgba(251,191,36,0.3)); opacity: 0.7; }
  50% { filter: drop-shadow(0 0 8px rgba(251,191,36,0.8)); opacity: 1; }
}
.flux-text {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--warning);
}
.flux-text.exhausted { color: var(--danger); }
.flux-bar.exhausted {
  animation: fluxExhaustedPulse 2s ease-in-out infinite;
  background: linear-gradient(180deg, rgba(248,113,113,0.08) 0%, rgba(248,113,113,0.02) 100%);
}
@keyframes fluxExhaustedPulse {
  0%, 100% { box-shadow: inset 0 0 10px rgba(248,113,113,0.05); }
  50% { box-shadow: inset 0 0 20px rgba(248,113,113,0.15); }
}

/* --- Toast --- */
.flux-toast {
  position: absolute;
  top: -2px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(248,113,113,0.9);
  color: #fff;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 10px;
  padding: 2px 10px;
  border-radius: 4px;
  white-space: nowrap;
  z-index: 10;
  animation: toastBounce 1.5s ease-in-out infinite;
}
@keyframes toastBounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-2px); }
}

/* --- Stats Row --- */
.stats-row {
  height: 24px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 4px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-dark);
  background: var(--bg-dark);
}
.stat-pill {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-right: 6px;
}
.stat-pill .stat-label {
  font-size: 9px;
  text-transform: uppercase;
  color: var(--text-dim);
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
}
.stat-pill .stat-value {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 11px;
}

/* --- Base Stat Selectors --- */
.base-selectors {
  height: 28px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 4px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-dark);
  background: var(--bg-dark);
  font-family: 'Rajdhani', sans-serif;
  font-size: 10px;
  color: var(--text-dim);
}
.base-selectors .bs-label {
  font-weight: 600;
  color: var(--bronze);
  margin-right: 2px;
}
.bs-select {
  background: var(--border-dark);
  border: 1px solid var(--border-mid);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  margin-right: 2px;
  cursor: pointer;
}
.bs-spacer { width: 8px; }

/* --- Tab Bar --- */
.tab-bar {
  height: 36px;
  display: flex;
  background: var(--bg-dark);
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-dark);
}
.tab-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: none;
  border: none;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  position: relative;
  transition: color 0.2s;
}
.tab-btn.active { color: var(--gold-light); }
.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 20%;
  right: 20%;
  height: 2px;
  background: var(--gold);
  border-radius: 1px;
}

/* --- Action Area (middle) --- */
.action-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--border-mid) transparent;
}
.action-area::-webkit-scrollbar { width: 4px; }
.action-area::-webkit-scrollbar-track { background: transparent; }
.action-area::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 2px; }

/* --- Workbench --- */
.workbench-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 12px 14px;
  background: linear-gradient(180deg, rgba(26,26,38,0.4) 0%, var(--bg-dark) 100%);
  box-shadow: inset 0 0 30px rgba(232,85,58,0.04);
}
.workbench-label {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 10px;
  text-transform: uppercase;
  color: var(--bronze);
  letter-spacing: 0.06em;
  margin-bottom: 10px;
  text-align: center;
}
.slots-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
}
.combine-slot {
  width: 52px;
  height: 52px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: border-color 0.3s, box-shadow 0.3s;
  cursor: pointer;
  overflow: hidden;
}
.combine-slot.empty {
  border: 2px dashed var(--border-mid);
  background: var(--bg-mid);
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
}
.combine-slot.filled { border: 2px solid; }
.combine-slot .slot-art {
  width: 30px;
  height: 30px;
  object-fit: contain;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
}
.combine-slot .slot-stat {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 8px;
  color: var(--text);
  margin-top: 1px;
  white-space: nowrap;
  position: relative;
  z-index: 1;
}
.combine-slot.glow-white { box-shadow: 0 0 12px rgba(255,255,255,0.3); }
.combine-slot.glow-gold {
  border-color: var(--gold-pale) !important;
  animation: goldPulse 1.5s ease-in-out infinite;
}
@keyframes goldPulse {
  0%, 100% { box-shadow: 0 0 12px rgba(212,168,52,0.35); }
  50% { box-shadow: 0 0 20px rgba(212,168,52,0.6); }
}
.slot-plus, .slot-arrow {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--text-dim);
  user-select: none;
}
.result-box {
  width: 52px;
  height: 52px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 20px;
  transition: all 0.3s;
}
.result-box.idle {
  border: 2px dashed var(--border-mid);
  background: var(--bg-mid);
  color: var(--text-dim);
}
.result-box.glow-white {
  border: 2px dashed rgba(255,255,255,0.3);
  background: var(--bg-mid);
  color: rgba(255,255,255,0.7);
  animation: whitePulseText 1.5s ease-in-out infinite;
}
.result-box.glow-gold {
  border: 2px solid var(--gold-pale);
  background: linear-gradient(135deg, rgba(212,168,52,0.08) 0%, rgba(236,208,106,0.04) 100%);
  color: var(--gold-pale);
  animation: goldPulse 1.5s ease-in-out infinite;
}
@keyframes whitePulseText {
  0%, 100% { color: rgba(255,255,255,0.5); }
  50% { color: rgba(255,255,255,0.9); }
}
.workbench-buttons {
  display: flex;
  gap: 8px;
}
.btn-combine {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  border: none;
  border-radius: 6px;
  padding: 6px 20px;
  cursor: pointer;
  letter-spacing: 0.03em;
}
.btn-combine.enabled {
  background: var(--gold);
  color: var(--bg-dark);
  box-shadow: var(--shadow-button);
}
.btn-combine.disabled {
  background: var(--border-dark);
  color: var(--text-muted);
  cursor: not-allowed;
}
.btn-clear {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  border: none;
  border-radius: 6px;
  padding: 6px 16px;
  background: var(--border-dark);
  color: var(--text-dim);
  cursor: pointer;
}

/* --- Equip Tab --- */
.equip-area {
  display: flex;
  flex-direction: column;
  padding: 8px 10px 0;
}
.item-switcher {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  justify-content: center;
}
.item-pill {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 12px;
  padding: 4px 14px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid var(--border-dark);
  background: transparent;
  color: var(--text-dim);
}
.item-pill.active {
  background: var(--border-dark);
  border-color: var(--gold);
  color: var(--gold-light);
}
.item-card { margin-bottom: 6px; }
.item-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.item-name {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--text);
}
.item-type-badge {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 8px;
  text-transform: uppercase;
  background: var(--border-dark);
  color: var(--bronze);
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.04em;
}
.item-bonuses {
  font-size: 11px;
  margin-bottom: 3px;
}
.item-bonuses .positive { color: var(--teal); }
.item-bonuses .negative { color: var(--danger); }
.item-base-stats {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 10px;
  color: var(--bronze);
  margin-bottom: 6px;
  letter-spacing: 0.03em;
}
.socket-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 6px;
}
.socket-slot {
  height: 48px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: box-shadow 0.3s, border-color 0.3s;
  position: relative;
}
.socket-slot.empty {
  background: var(--bg-mid);
  border: 1.5px dashed var(--border-mid);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
}
.socket-slot.filled { border: 2px solid; }
.socket-slot .socket-art {
  width: 28px;
  height: 28px;
  object-fit: contain;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
}
.socket-slot .socket-stat {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 7px;
  color: var(--text);
  margin-top: 1px;
  position: relative;
  z-index: 1;
}
.socket-slot.empty.pulse-gold {
  animation: socketGoldPulse 1.5s ease-in-out infinite;
}
@keyframes socketGoldPulse {
  0%, 100% { box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 8px rgba(212,168,52,0.3); }
  50% { box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 16px rgba(212,168,52,0.5); }
}
.socket-slot.locked {
  border: 1.5px solid #6a6a88;
  background: rgba(30,30,50,0.6);
  opacity: 0.7;
  cursor: default;
}
.socket-lock-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  z-index: 5;
  pointer-events: none;
  background: rgba(0,0,0,0.25);
  border-radius: 8px;
}
.equipped-list { margin-bottom: 6px; }
.equipped-list .equip-line {
  font-size: 10px;
  color: var(--text);
  margin-bottom: 1px;
  font-family: 'DM Sans', sans-serif;
  display: flex;
  align-items: center;
  gap: 4px;
}
.equipped-list .equip-line .equip-stat { color: #aaa; }
.equipped-list .equip-line .equip-art-mini {
  width: 14px;
  height: 14px;
  object-fit: contain;
  filter: drop-shadow(0 0 2px rgba(0,0,0,0.4));
}

/* --- Mini Preview Bar --- */
.mini-preview {
  height: 36px;
  background: var(--bg-mid);
  border-top: 1px solid var(--border-dark);
  display: flex;
  align-items: center;
  padding: 0 12px;
  cursor: pointer;
  flex-shrink: 0;
}
.mini-preview .mini-left {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 12px;
  color: var(--text);
}
.mini-preview .mini-center {
  flex: 1;
  display: flex;
  justify-content: center;
  gap: 4px;
}
.mini-preview .mini-center .socket-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.mini-preview .mini-center .socket-dot.empty-dot {
  background: var(--border-mid);
}
.mini-preview .mini-right {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 12px;
  color: var(--text-dim);
}

/* --- Gem Tray / Stockpile (BOTTOM) --- */
.gem-tray {
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  min-height: 140px;
  max-height: 280px;
  padding: 6px 10px 8px;
  border-top: 1px solid var(--border-dark);
  background: linear-gradient(0deg, var(--bg-darkest) 0%, var(--bg-dark) 100%);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-mid) transparent;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
.gem-tray::-webkit-scrollbar { width: 4px; }
.gem-tray::-webkit-scrollbar-track { background: transparent; }
.gem-tray::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 2px; }

.tray-label {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 10px;
  text-transform: uppercase;
  color: var(--bronze);
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.gem-grid {
  display: grid;
  gap: 8px;
}
.gem-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.gem-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }

/* --- REAL GemCard Styling --- */
.gem-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform 0.15s, filter 0.15s;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
.gem-card:hover .gem-square {
  transform: scale(1.08);
  filter: brightness(110%);
}
.gem-card:active .gem-square {
  transform: scale(0.93);
}

.gem-square {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 16%;
  border: 2.5px solid;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s, filter 0.15s, border-color 0.2s, box-shadow 0.2s;
  gap: 1px;
}

.gem-square .gem-specular {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 55%);
  pointer-events: none;
  z-index: 2;
}

.gem-art {
  object-fit: contain;
  position: relative;

}

.gem-stat-text {

}

/* Below square: name + category */
.gem-name {
  font-family: 'Rajdhani', sans-serif;

/* Selected state */
.gem-card.selected .gem-square {
  filter: drop-shadow(0 0 14px var(--gem-glow));
}

/* Equipped / staged dimming */
.gem-card.equipped .gem-square,
.gem-card.staged .gem-square {
  opacity: 0.35;
}

.gem-badge {
  position: absolute;
  top: 2px;
  right: 2px;

}

/* Context menu prevention */
.gem-card, .gem-tray, .socket-slot, .combine-slot {
  -webkit-touch-callout: none;
}

// --- Rendering ---

function renderFluxBar(s) {
  const isExhausted = s.fluxCurrent === 0;
  const isLow = s.fluxCurrent > 0 && s.fluxCurrent <= 2;
  let html = `<div class="flux-bar${isExhausted ? ' exhausted' : ''}">`;
  if (s.toast) {
    html += `<div class="flux-toast">${s.toast}</div>`;
  }
  html += '<div class="flux-bolts">';
  for (let i = 0; i < s.fluxMax; i++) {
    const filled = i < s.fluxCurrent;
    let cls = filled ? 'flux-bolt filled' : 'flux-bolt spent';
    if (filled && isLow) cls += ' low-pulse';
    html += `<span class="${cls}">\u26A1</span>`;
  }
  html += '</div>';
  html += `<div class="flux-text${isExhausted ? ' exhausted' : ''}">${s.fluxCurrent} / ${s.fluxMax} FLUX</div>`;
  html += '</div>';
  return html;
}

function renderHeader(s) {
  const timerPct = (s.timer / s.timerMax * 100).toFixed(0);
  const urgent = s.timer <= 30;
  let html = '<div class="header"><div class="header-row1">';
  html += '<span class="phase-title">Forge Phase</span>';
  html += `<span class="round-pill">R${s.round}</span>`;
  html += '<span class="header-spacer"></span>';
  html += `<div class="timer-bar-wrap"><div class="timer-bar-fill ${urgent ? 'urgent' : 'normal'}" style="width:${timerPct}%"></div><div class="timer-bar-text">${s.timer}s</div></div>`;
  html += '<button class="done-btn">Done</button>';
  html += '</div></div>';
  return html;
}

function renderStatsRow(s) {
  const colors = { hp: '#34d399', dmg: '#e8e8f0', arm: '#2dd4bf', crt: s.stats.crt === '0%' ? '#f87171' : '#fbbf24' };
  let html = '<div class="stats-row">';
  html += `<span class="stat-pill"><span class="stat-label">HP</span><span class="stat-value" style="color:${colors.hp}">${s.stats.hp}</span></span>`;
  html += `<span class="stat-pill"><span class="stat-label">DMG</span><span class="stat-value" style="color:${colors.dmg}">${s.stats.dmg}</span></span>`;
  html += `<span class="stat-pill"><span class="stat-label">ARM</span><span class="stat-value" style="color:${colors.arm}">${s.stats.arm}</span></span>`;
  html += `<span class="stat-pill"><span class="stat-label">CRT</span><span class="stat-value" style="color:${colors.crt}">${s.stats.crt}</span></span>`;
  html += '</div>';
  return html;
}

function renderBaseSelectors(s) {
  if (!s.showBaseSelectors) return '';
  let html = '<div class="base-selectors">';
  html += '<span class="bs-label">Weapon:</span>';
  html += '<span class="bs-select">STR \u25BE</span>';
  html += '<span class="bs-select">VIT \u25BE</span>';
  html += '<span class="bs-spacer"></span>';
  html += '<span class="bs-label">Armor:</span>';
  html += '<span class="bs-select">VIT \u25BE</span>';
  html += '<span class="bs-select">STR \u25BE</span>';
  html += '</div>';
  return html;
}

  const cActive = s.tab === 'combine' ? ' active' : '';
  const eActive = s.tab === 'equip' ? ' active' : '';
  return `<div class="tab-bar"><button class="tab-btn${cActive}">\u2692 Plan &amp; Combine</button><button class="tab-btn${eActive}">\u2694 Equip</button></div>`;
}

function getGemSizes(count) {
  if (count <= 8) return { artSize: 43, statSize: 9, nameSize: 9, catSize: 8 };
  if (count <= 12) return { artSize: 36, statSize: 9, nameSize: 9, catSize: 8 };
  return { artSize: 30, statSize: 8, nameSize: 8, catSize: 7 };
}

function renderGemCard(gem, s) {
  const el = ELEMENTS[gem.el];
  const isEquipped = s.equippedIds.includes(gem.id);
  const isStaged = s.stagedIds.includes(gem.id);
  const isSelected = s.selectedId === gem.id;
  const tierColor = TIERS[gem.tier];
  const sizes = getGemSizes(s.gems.length);

  let cls = 'gem-card';
  if (isSelected) cls += ' selected';
  if (isEquipped) cls += ' equipped';
  if (isStaged) cls += ' staged';

  const borderColor = el.color;
  const bgGrad = ELEMENT_GRADIENTS[gem.el];
  const glowShadow = gem.tier >= 3 ? `box-shadow:0 0 ${4 + gem.tier * 2}px ${tierColor};` : '';

  let badgeHtml = '';
  if (isEquipped) badgeHtml = '<div class="gem-badge">\u2694</div>';
  else if (isStaged) badgeHtml = '<div class="gem-badge">\u2692</div>';

  let dots = '';
  for (let i = 0; i < gem.tier; i++) {
    dots += `<div class="dot" style="background:${tierColor}"></div>`;
  }

  const glowStyle = isSelected ? `--gem-glow:${el.glow};` : '';
  const artSrc = GEM_ART[gem.id] || '';

  return `<div class="${cls}" style="${glowStyle}">
    <div class="gem-square" style="border-color:${borderColor};background:${bgGrad};${glowShadow}">
      <div class="gem-specular"></div>
      <img class="gem-art" src="${artSrc}" alt="${gem.name}" style="width:${sizes.artSize}px;height:${sizes.artSize}px" draggable="false">
      <div class="gem-stat-text" style="font-size:${sizes.statSize}px">${gem.stat}</div>
      <div class="gem-tier-dots">${dots}</div>
      ${badgeHtml}
    </div>
    <div class="gem-name" style="font-size:${sizes.nameSize}px">${gem.name}</div>
    <div class="gem-category" style="font-size:${sizes.catSize}px">${gem.cat}</div>
  </div>`;
}

function renderGemTray(s) {
  const count = s.gems.length;
  const colsClass = count > 8 ? 'cols-5' : 'cols-4';
  let cards = '';
  s.gems.forEach(gem => { cards += renderGemCard(gem, s); });

  return `<div class="gem-tray">
    <div class="tray-label">STOCKPILE \u00B7 ${count} ORBS</div>
    <div class="gem-grid ${colsClass}">${cards}</div>
  </div>`;
}

function renderCombineSlot(gemId, s, glowClass) {
  if (gemId === null) {
    return '<div class="combine-slot empty"></div>';
  }
  const gem = s.gems.find(g => g.id === gemId) || BASE_GEMS.find(g => g.id === gemId);
  if (!gem) return '<div class="combine-slot empty"></div>';
  const el = ELEMENTS[gem.el];
  const isGold = glowClass === 'glow-gold';
  const borderColor = isGold ? '#ecd06a' : el.color;
  const bg = hexToRgba(el.color, 0.15);
  const artSrc = GEM_ART[gem.id] || '';
  return `<div class="combine-slot filled ${glowClass}" style="border-color:${borderColor};background:${bg}">
    <img class="slot-art" src="${artSrc}" alt="${gem.name}" draggable="false">
    <span class="slot-stat">${gem.stat}</span>
  </div>`;
}

function renderWorkbench(s) {
  const filled = s.combineSlots.filter(id => id !== null).length;
  let isGold = false;
  if (filled >= 2) {
    const slot0 = s.combineSlots[0];
    const slot1 = s.combineSlots[1];
    if (slot0 !== null && slot1 !== null) {
      const gem0 = s.gems.find(g => g.id === slot0) || BASE_GEMS.find(g => g.id === slot0);
      const gem1 = s.gems.find(g => g.id === slot1) || BASE_GEMS.find(g => g.id === slot1);
      if (gem0 && gem1 && gem0.el === gem1.el) isGold = true;
    }
  }
  const glowClass = filled >= 2 ? (isGold ? 'glow-gold' : 'glow-white') : '';

  let resultClass = 'result-box idle';
  let resultContent = '?';
  if (filled >= 2) {
    if (isGold) { resultClass = 'result-box glow-gold'; resultContent = '\u2726'; }
    else { resultClass = 'result-box glow-white'; resultContent = '?'; }
  }

  const combineDisabled = filled < 2 || s.fluxCurrent === 0;
  const btnClass = combineDisabled ? 'btn-combine disabled' : 'btn-combine enabled';

  let html = '<div class="workbench-area">';
  html += '<div class="workbench-label">\u2692 COMBINATION WORKBENCH</div>';
  html += '<div class="slots-row">';
  html += renderCombineSlot(s.combineSlots[0], s, glowClass);
  html += '<span class="slot-plus">+</span>';
  html += renderCombineSlot(s.combineSlots[1], s, glowClass);
  html += '<span class="slot-plus">+</span>';
  html += renderCombineSlot(s.combineSlots[2], s, glowClass);
  html += '<span class="slot-arrow">\u2192</span>';
  html += `<div class="${resultClass}">${resultContent}</div>`;
  html += '</div>';
  html += '<div class="workbench-buttons">';
  html += `<button class="${btnClass}">Combine</button>`;
  html += '<button class="btn-clear">Clear</button>';
  html += '</div>';
  html += '</div>';
  return html;
}

function renderSocketSlot(sock, hasSelection) {
  if (sock && sock.gemId !== undefined) {
    const gem = BASE_GEMS.find(g => g.id === sock.gemId);
    if (!gem) return '<div class="socket-slot empty"></div>';
    const el = ELEMENTS[gem.el];
    const shortName = gem.name.replace(/\s+/g, ' ');
    const artSrc = GEM_ART[gem.id] || '';

    if (sock.locked) {
      return `<div class="socket-slot filled locked" style="border-color:#6a6a88;background:${hexToRgba(el.color, 0.1)}">
        <img class="socket-art" src="${artSrc}" alt="${shortName}" draggable="false">
        <span class="socket-stat">${shortName}</span>
        <div class="socket-lock-overlay">\u{1F512}</div>
      </div>`;
    }

    return `<div class="socket-slot filled" style="border-color:${el.color};background:${hexToRgba(el.color, 0.2)}">
      <img class="socket-art" src="${artSrc}" alt="${shortName}" draggable="false">
      <span class="socket-stat">${shortName}</span>
    </div>`;
  }
  return `<div class="socket-slot empty${hasSelection ? ' pulse-gold' : ''}"></div>`;
}

function renderEquipArea(s) {
  const item = s.items[s.activeItem];
  const otherItem = s.items[1 - s.activeItem];
  const hasSelection = s.selectedId !== null && !s.equippedIds.includes(s.selectedId) && !s.stagedIds.includes(s.selectedId);

  let html = '<div class="equip-area">';

  // Item switcher
  html += '<div class="item-switcher">';
  s.items.forEach((it, idx) => {
    const cls = idx === s.activeItem ? 'item-pill active' : 'item-pill';
    html += `<button class="${cls}">${it.icon} ${it.name}</button>`;
  });
  html += '</div>';

  // Item card
  html += '<div class="item-card">';
  html += '<div class="item-header">';
  html += `<span class="item-name">${item.name}</span>`;
  html += `<span class="item-type-badge">${item.type}</span>`;
  html += '</div>';

  // Bonuses
  html += '<div class="item-bonuses">';
  item.bonuses.forEach((b, i) => {
    html += `<span class="${b.p ? 'positive' : 'negative'}">${b.t}</span>`;
    if (i < item.bonuses.length - 1) html += '&nbsp;&nbsp;';
  });
  html += '</div>';

  // Base stats
  html += `<div class="item-base-stats">${item.base}</div>`;

  // Socket grid
  html += '<div class="socket-grid">';
  item.sockets.forEach(sock => {
    html += renderSocketSlot(sock, hasSelection);
  });
  html += '</div>';

  // Equipped affixes list
  const equippedSockets = item.sockets.filter(sock => sock && sock.gemId !== undefined);
  if (equippedSockets.length > 0) {
    html += '<div class="equipped-list">';
    equippedSockets.forEach(sock => {
      const gem = BASE_GEMS.find(g => g.id === sock.gemId);
      if (gem) {
        const el = ELEMENTS[gem.el];
        const artSrc = GEM_ART[gem.id] || '';
        const lockIcon = sock.locked ? ' \u{1F512}' : '';
        html += `<div class="equip-line"><img class="equip-art-mini" src="${artSrc}" alt="${gem.name}" draggable="false"> ${gem.name} <span class="equip-stat">${gem.stat}</span>${lockIcon}</div>`;
      }
    });
    html += '</div>';
  }

  html += '</div>'; // item-card
  html += '</div>'; // equip-area

  // Mini preview bar
  const filledOther = otherItem.sockets.filter(sock => sock !== null).length;
  html += '<div class="mini-preview"><div class="mini-left">';
  html += `${otherItem.icon} ${otherItem.name}`;
  html += '</div><div class="mini-center">';
  otherItem.sockets.forEach(sock => {
    if (sock && sock.gemId !== undefined) {
      const gem = BASE_GEMS.find(g => g.id === sock.gemId);
      const color = gem ? ELEMENTS[gem.el].color : '#363650';
      html += `<div class="socket-dot" style="background:${color}"></div>`;
    } else {
      html += '<div class="socket-dot empty-dot"></div>';
    }
  });
  html += `</div><div class="mini-right">${filledOther}/${otherItem.sockets.length}</div></div>`;

  return html;
}

function renderScenario(idx) {
  currentScenario = idx;
  const s = scenarios[idx];
  const app = document.getElementById('app');

  let html = '';

  // 1. Header
  html += renderHeader(s);

  // 2. Flux bar
  html += renderFluxBar(s);

  // 3. Stats row
  html += renderStatsRow(s);

  // 4. Base stat selectors (R1 only, scenario 1)
  html += renderBaseSelectors(s);

  // 5. Tab bar
  html += renderTabBar(s);

  // 6. Action area (MIDDLE)
  html += '<div class="action-area">';
  if (s.tab === 'combine') {
    html += renderWorkbench(s);
  } else {
    html += renderEquipArea(s);
  }
  html += '</div>';

  // 7. Gem tray / Stockpile (BOTTOM)
  html += renderGemTray(s);

  app.innerHTML = html;

  // Update nav buttons
  document.querySelectorAll('.scenario-nav button').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });
}

// --- Scenario Nav ---
const nav = document.getElementById('scenario-nav');
scenarios.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.textContent = s.label;
  btn.addEventListener('click', () => renderScenario(i));
  nav.appendChild(btn);
});

// --- Init ---
renderScenario(0);
</script>
</body>
</html>
